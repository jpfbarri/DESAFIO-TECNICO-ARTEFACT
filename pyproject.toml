[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-da-musica-agent"
version = "1.0.0"
description = "Agente de atendimento em Python para a Empório da Música (Desafio Técnico AI Engineer — Artefact)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "langgraph>=0.2.50",
    "langchain-google-genai>=2.0.5",
    "langchain-mcp-adapters>=0.1.0",
    "fastmcp>=0.4.0",
    "fastembed>=0.4.0",
    "faiss-cpu>=1.9.0",
    "pypdf>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ipykernel>=6.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

